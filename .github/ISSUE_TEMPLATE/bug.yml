name: Bug
description: Something is broken.
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, company/period, mode (dev or packaged), and app version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error text, logs (output/logs/ or the Documents data root), screenshots.
    validations:
      required: false
  - type: dropdown
    id: shipping_class
    attributes:
      label: Shipping class
      description: What merging the fix publishes (docs/agents/triage-labels.md). Triage applies the matching `ships:*` label; the owner can change it.
      options:
        - Not sure (triage decides)
        - "ships:none - dev tooling, CI or tests only: publishes nothing"
        - "ships:pre - fix ships in the next pre-release"
        - "ships:release - fix completes a large implementation: release"
        - "ships:hotfix - breaks the current release: immediate release"
    validations:
      required: true
