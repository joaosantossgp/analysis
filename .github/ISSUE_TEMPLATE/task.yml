name: Task
description: One unit of work that a single PR can close.
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        One task, one PR (a PR may close several tasks). If this task belongs to
        a goal, add it as a sub-issue of the goal. Use native "blocked by" links
        for dependencies; unblocked tasks can run in parallel.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done, from the analyst's or developer's point of view.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions, including loading, empty, error, and partial states where relevant.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Files and areas
      description: Paths or modules this task is expected to touch. Tasks that share files should block each other instead of running in parallel.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Workflow step and owning workspace (see docs/PRODUCT_DIRECTION.md), source class, links, and anything out of scope.
    validations:
      required: false
  - type: dropdown
    id: shipping_class
    attributes:
      label: Shipping class
      description: What merging this task publishes (docs/agents/triage-labels.md). Triage applies the matching `ships:*` label; the owner can change it. Only the task that makes a large implementation reachable is `ships:release`; earlier parts are `ships:none`.
      options:
        - Not sure (triage decides)
        - "ships:none - docs, CI, tests, dev tooling: publishes nothing"
        - "ships:pre - small or medium functionality or fix: pre-release"
        - "ships:release - makes a large implementation reachable: release"
        - "ships:hotfix - fixes a bug breaking the current release: immediate release"
    validations:
      required: true
