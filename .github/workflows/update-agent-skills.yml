name: Verify Agent Skills

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.gitattributes'
      - '.gitignore'
      - 'scripts/governance/*agent_skills.py'
      - '.github/workflows/update-agent-skills.yml'

permissions:
  contents: read

concurrency:
  group: agent-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m unittest scripts.governance.test_update_agent_skills
      - run: python scripts/governance/update_agent_skills.py --verify
