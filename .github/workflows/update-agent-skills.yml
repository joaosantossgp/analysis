name: Verify Agent Skills

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.gitattributes'
      - '.gitignore'
      - 'scripts/governance/*agent_skills.py'
      - '.github/workflows/update-agent-skills.yml'

permissions:
  contents: read

concurrency:
  group: agent-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest scripts.governance.test_update_agent_skills
      - run: python scripts/governance/update_agent_skills.py --verify
