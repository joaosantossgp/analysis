name: Maintain Agent Skills

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.gitattributes'
      - '.gitignore'
      - 'scripts/governance/*agent_skills.py'
      - '.github/workflows/update-agent-skills.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-skills-${{ github.event.pull_request.number || 'maintenance' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest scripts.governance.test_update_agent_skills
      - run: python scripts/governance/update_agent_skills.py --verify

  update:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.SKILL_UPDATE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check for a pending maintenance PR
        id: pending
        shell: bash
        run: |
          count=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | test("^chore/[0-9]+-agent-skill-updates$"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Refresh pinned skill snapshots
        if: steps.pending.outputs.count == '0'
        run: python scripts/governance/update_agent_skills.py
      - name: Open a reviewed update
        if: steps.pending.outputs.count == '0'
        shell: bash
        env:
          HAS_UPDATE_TOKEN: ${{ secrets.SKILL_UPDATE_TOKEN != '' }}
        run: |
          set -euo pipefail
          git add -- .agents/skills
          if git diff --cached --quiet; then
            echo 'No upstream skill changes.'
            exit 0
          fi
          if [ "$HAS_UPDATE_TOKEN" != 'true' ]; then
            echo '::error::Set SKILL_UPDATE_TOKEN to publish update PRs that trigger CI. No issue, branch or PR was created.'
            exit 1
          fi
          python scripts/governance/update_agent_skills.py --verify
          cat > "$RUNNER_TEMP/skill-issue.md" <<'EOF'
          Update the vendored agent skills to the upstream snapshots recorded in installation-manifest.json.

          Review upstream instruction changes, auxiliary files, repository precedence and hashes. Run the skill integrity checks and repository CI before merging. No automatic merge is allowed.

          Files and areas: .agents/skills/**
          EOF
          issue_url=$(gh issue create --title 'Update vendored agent skills' --label enhancement --label needs-triage --body-file "$RUNNER_TEMP/skill-issue.md")
          issue_number=${issue_url##*/}
          branch="chore/$issue_number-agent-skill-updates"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update vendored agent skills'
          gh auth setup-git
          git push origin "$branch"
          printf 'Closes #%s\n\n' "$issue_number" > "$RUNNER_TEMP/skill-pr.md"
          cat >> "$RUNNER_TEMP/skill-pr.md" <<'EOF'
          ## Summary
          Refresh upstream skill snapshots and their pinned commits and SHA-256 hashes. Repository AGENTS.md takes precedence over upstream instructions.

          ## Evidence
          The updater verified local integrity, downloaded and checked upstream Git blobs, and verified the resulting installation. Review the skill diff and wait for CI before merging.

          ## Merge Danger
          These instructions affect future agent behavior. No application code or user data changes; revert the PR to restore the previous snapshots. No automatic merge.
          EOF
          gh pr create --base main --head "$branch" --title 'chore: update vendored agent skills' --body-file "$RUNNER_TEMP/skill-pr.md"
