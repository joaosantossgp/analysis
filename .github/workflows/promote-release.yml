name: Promote Release

# Promotion (ADR 0011, issue #631). The owner turns an existing pre-release into
# the latest release: same tag, same files, no rebuild and no new tag. The check
# job refuses anything but a published pre-release newer than the latest
# release, and re-verifies the published ZIP against its .sha256 and the
# unversioned alias against the ZIP; its summary is the approval request. The
# promote job repeats those checks after the owner approves in the
# release-publication environment, then edits the release. The scheduled
# promotion-proposal.yml only proposes. Contract: docs/release-process.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release to promote, for example 0.30.1."
        type: string
        required: true

permissions:
  contents: read

# One promotion at a time and never cancelled. Not the publication group, so a
# publication run neither cancels nor is cancelled by a pending promotion.
concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  check:
    name: Check promotion of ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify the pre-release and its published files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python scripts/release/promotion_workflow.py verify --version "$VERSION"

  promote:
    name: Promote ${{ inputs.version }} to release after the owner's approval
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Re-verify and mark the pre-release as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python scripts/release/promotion_workflow.py promote --version "$VERSION"
