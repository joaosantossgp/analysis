name: PR Issue Guardrails

# Every PR references at least one issue. A PR may close several task or bug
# issues. Goal issues are closed by hand when their sub-issues are done, so a PR
# references them with `Refs #n` / `Part of #n`, never a closing keyword.
# Reads the PR body and issue labels only; never checks out PR code.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-pr-issue-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue references
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const closing = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map((m) => Number(m[1]));
            const linked = [...body.matchAll(/\b(?:refs?|part of)\s+#(\d+)/gi)].map((m) => Number(m[1]));

            if (closing.length + linked.length === 0) {
              core.setFailed("Reference at least one issue in the PR body: `Closes #n` for tasks/bugs, `Refs #n` for goals or related issues.");
              return;
            }

            for (const number of new Set(closing)) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number }));
              } catch (error) {
                core.setFailed(`#${number} was not found in this repository.`);
                return;
              }
              if (issue.pull_request) {
                core.setFailed(`#${number} is a pull request. Close issues, not PRs.`);
                return;
              }
              const labels = issue.labels.map((label) => (typeof label === "string" ? label : label.name));
              if (labels.includes("goal")) {
                core.setFailed(`#${number} is a goal. Use \`Refs #${number}\`; close the goal by hand when its sub-issues are done.`);
                return;
              }
            }

            core.info(`Closes: ${[...new Set(closing)].join(", ") || "none"}; refs: ${[...new Set(linked)].join(", ") || "none"}.`);
