name: PR Issue Guardrails

# Every PR references at least one issue and declares its documentation impact.
# A PR may close several task or bug issues. Goal issues are closed by hand when
# their sub-issues are done, so a PR references them with `Refs #n` / `Part of #n`,
# never a closing keyword.
# Every PR resolves a shipping class (ADR 0011) from the `ships:*` labels of the
# issues it closes; label edits on an issue take effect on the PR's next event.
# Reads the PR body and issue labels only; never checks out PR code.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-pr-issue-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue references
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const closing = new Set([...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map((m) => Number(m[1])));
            const linked = new Set([...body.matchAll(/\b(?:refs?|part of)\s+#(\d+)/gi)].map((m) => Number(m[1])));

            if (closing.size + linked.size === 0) {
              core.setFailed("Reference at least one issue in the PR body: `Closes #n` for tasks/bugs, `Refs #n` for goals or related issues.");
              return;
            }

            const docImpactMatch = body.match(/(?:^|\r?\n)##\s+Documentation impact[ \t]*(?:\r?\n|$)([\s\S]*?)(?=\r?\n##\s+|$)/i);
            const docImpactText = docImpactMatch
              ? docImpactMatch[1].replace(/<!--[\s\S]*?-->/g, "").trim()
              : "";
            if (!docImpactText) {
              core.setFailed("Include a non-empty `## Documentation impact` section naming updated owner docs or explaining why no documentation update is needed.");
              return;
            }

            const cache = new Map();
            const loadIssue = async (number) => {
              if (cache.has(number)) return cache.get(number);
              const { data } = await github.rest.issues.get({ ...context.repo, issue_number: number });
              cache.set(number, data);
              return data;
            };

            // Shipping class (ADR 0011): highest `ships:*` label among closed issues; Refs goals never count.
            const classOrder = ["none", "pre", "release", "hotfix"];
            let shippingRank = -1;

            for (const number of new Set([...closing, ...linked])) {
              let issue;
              try {
                issue = await loadIssue(number);
              } catch (error) {
                core.setFailed(`#${number} was not found in this repository.`);
                return;
              }
              if (issue.pull_request) {
                core.setFailed(`#${number} is a pull request. Reference issues, not PRs.`);
                return;
              }
              if (closing.has(number)) {
                const labels = issue.labels.map((label) => (typeof label === "string" ? label : label.name));
                if (labels.includes("goal")) {
                  core.setFailed(`#${number} is a goal. Use \`Refs #${number}\`; close the goal by hand when its sub-issues are done.`);
                  return;
                }
                for (const label of labels.filter((name) => name.startsWith("ships:"))) {
                  shippingRank = Math.max(shippingRank, classOrder.indexOf(label.slice("ships:".length)));
                }
              }
            }

            if (shippingRank < 0) {
              core.setFailed("No shipping class: none of the issues this PR closes (`Closes #n`) carries `ships:none`, `ships:pre`, `ships:release` or `ships:hotfix`. Label the task or bug issue (see docs/agents/triage-labels.md); goals referenced with `Refs #n` do not count.");
              return;
            }

            core.info(`Closes: ${[...closing].join(", ") || "none"}; refs: ${[...linked].join(", ") || "none"}.`);
            core.info(`Shipping class: ${classOrder[shippingRank]} (highest of hotfix > release > pre > none across closed issues).`);
