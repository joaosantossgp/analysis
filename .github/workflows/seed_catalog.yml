name: Seed Catalog

on:
  workflow_dispatch:

jobs:
  seed-catalog:
    name: Seed companies catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Aborting catalog seed to avoid writing to an unintended database."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ensure companies schema
        run: python scripts/setup/setup_db.py --step 2

      - name: Seed CVM catalog
        run: python scripts/data/seed_catalog.py

      - name: Smoke check - validate counts and ranking
        run: |
          python - <<'PY'
          import sys
          from sqlalchemy import text

          from src.platform.db import build_engine
          from src.platform.settings import build_settings

          settings = build_settings()
          engine = build_engine(settings)
          with engine.begin() as conn:
              total = conn.execute(text("SELECT COUNT(*) FROM companies")).scalar() or 0
              coverage_ranks = conn.execute(
                  text(
                      """
                      SELECT coverage_rank
                      FROM companies
                      WHERE coverage_rank IS NOT NULL
                      ORDER BY coverage_rank
                      """
                  )
              ).scalars().all()

          expected_ranks = list(range(1, 121))
          if total < 600:
              print(f"::error::Expected at least 600 companies after seed, got {total}.")
              sys.exit(1)
          if coverage_ranks != expected_ranks:
              print(
                  "::error::Expected coverage_rank sequence 1..120 with no gaps; "
                  f"got {len(coverage_ranks)} ranked rows and sequence {coverage_ranks[:10]}..."
              )
              sys.exit(1)

          print(f"::notice::companies={total}")
          print(f"::notice::coverage_rank_count={len(coverage_ranks)}")
          PY
