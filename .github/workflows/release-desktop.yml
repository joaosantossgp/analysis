name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      # After artifact expiry, dispatch a fresh candidate cycle for the same
      # version/SHA; the expired run is superseded evidence and cannot publish.
      phase:
        description: "Candidate builds once; attest records trusted evidence; publish consumes both."
        required: true
        type: choice
        options:
          - candidate
          - attest
          - publish
      version:
        description: "Version without v (X.Y.Z or X.Y.Z-rc.N). The matching tag must already exist."
        required: true
        type: string
      candidate_sha:
        description: "Full 40-character commit SHA that the existing tag must resolve to."
        required: true
        type: string
      candidate_run_id:
        description: "Successful candidate-phase workflow run ID (required for attest and publish)."
        required: false
        type: string
      attestation_run_id:
        description: "Successful trusted attest-phase workflow run ID (required only for publish)."
        required: false
        type: string
      local_data_evidence_summary:
        description: "Required for attest: human local-data verification summary."
        required: false
        type: string
      packaged_evidence_summary:
        description: "Required for attest: human packaged-app verification summary."
        required: false
        type: string
      api_evidence_status:
        description: "Required for attest: API evidence decision (required or not-required)."
        required: false
        type: string
      api_evidence_basis_type:
        description: "Required for attest: API decision basis (candidate-diff or release-policy)."
        required: false
        type: string
      api_evidence_basis_summary:
        description: "Required for attest: API decision basis summary."
        required: false
        type: string
      api_evidence_result_summary:
        description: "Required when API evidence is required: human result summary."
        required: false
        type: string
      ccee_evidence_status:
        description: "Required for attest: CCEE evidence decision (required or not-required)."
        required: false
        type: string
      ccee_evidence_basis_type:
        description: "Required for attest: CCEE decision basis (candidate-diff or release-policy)."
        required: false
        type: string
      ccee_evidence_basis_summary:
        description: "Required for attest: CCEE decision basis summary."
        required: false
        type: string
      ccee_evidence_result_summary:
        description: "Required when CCEE evidence is required: human result summary."
        required: false
        type: string
      strict_backup_evidence_status:
        description: "Required for attest: rollback-backup decision (required or not-required)."
        required: false
        type: string
      strict_backup_evidence_basis_type:
        description: "Required for attest: rollback-backup decision basis (candidate-diff or release-policy)."
        required: false
        type: string
      strict_backup_evidence_basis_summary:
        description: "Required for attest: rollback-backup decision basis summary."
        required: false
        type: string
      strict_backup_evidence_result_summary:
        description: "Required when rollback-backup evidence is required: human result summary."
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve-candidate:
    if: inputs.phase == 'candidate'
    name: Resolve exact candidate and CI gate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      tag_target_sha: ${{ steps.resolve.outputs.tag_target_sha }}
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      ci_run_url: ${{ steps.resolve.outputs.ci_run_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact tag target and latest exact-SHA main CI
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Release dispatches must run the reviewed workflow from refs/heads/main."
          }
          $version = $env:RELEASE_VERSION.Trim()
          $releaseVersionPattern = '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-rc\.(?:0|[1-9][0-9]*))?$'
          if ($version -notmatch $releaseVersionPattern) {
            throw "Unsupported release version '$version'. Expected X.Y.Z or X.Y.Z-rc.N."
          }
          $candidateSha = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          if ($candidateSha -notmatch '^[0-9a-f]{40}$') {
            throw "candidate_sha must be a full 40-character lowercase hexadecimal commit SHA."
          }
          $observedSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observedSha -ne $candidateSha) {
            throw "Checkout drift: expected $candidateSha, observed $observedSha."
          }
          $tag = "v$version"
          git fetch --no-tags origin main
          git fetch --force origin "refs/tags/$tag`:refs/tags/$tag"
          git merge-base --is-ancestor $candidateSha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate $candidateSha is not reachable from origin/main."
          }
          $tagTargetSha = (git rev-parse "$tag^{commit}").Trim().ToLowerInvariant()
          if ($tagTargetSha -ne $candidateSha) {
            throw "Tag target mismatch: $tag resolves to $tagTargetSha, expected $candidateSha."
          }
          $runs = gh api "/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$candidateSha&per_page=100" | ConvertFrom-Json
          $exactRuns = @($runs.workflow_runs | Where-Object {
            $_.event -eq "push" -and $_.head_branch -eq "main" -and $_.head_sha -eq $candidateSha
          } | Sort-Object -Property @{ Expression = { $_.created_at }; Descending = $true }, @{ Expression = { $_.run_attempt }; Descending = $true })
          if ($exactRuns.Count -eq 0) {
            throw "No push/main CI run exists for exact candidate SHA $candidateSha."
          }
          $latest = $exactRuns[0]
          if ($latest.status -ne "completed" -or $latest.conclusion -ne "success") {
            throw "Latest exact-SHA push/main CI run $($latest.id) is $($latest.status)/$($latest.conclusion), not completed/success."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "candidate_sha=$candidateSha" >> $env:GITHUB_OUTPUT
          "tag_target_sha=$tagTargetSha" >> $env:GITHUB_OUTPUT
          "ci_run_id=$($latest.id)" >> $env:GITHUB_OUTPUT
          "ci_run_url=$($latest.html_url)" >> $env:GITHUB_OUTPUT

  build-windows:
    if: inputs.phase == 'candidate'
    name: Build immutable Windows candidate
    needs: resolve-candidate
    runs-on: windows-latest
    outputs:
      package_artifact_id: ${{ steps.upload_package.outputs.artifact-id }}
      evidence_artifact_id: ${{ steps.upload_evidence.outputs.artifact-id }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Windows builder checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ needs.resolve-candidate.outputs.candidate_sha }}"
          $observed = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observed -ne $expected) {
            throw "Windows builder checkout drift: expected $expected, observed $observed."
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop-web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Vite desktop UI dependencies
        run: npm ci --prefix apps/desktop-web

      - name: Build desktop bundle once
        shell: pwsh
        run: |
          .\desktop\build_desktop.ps1 -Version "${{ needs.resolve-candidate.outputs.version }}"

      - name: Verify bundled version and build provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVersion = "${{ needs.resolve-candidate.outputs.version }}"
          $expectedSha = "${{ needs.resolve-candidate.outputs.candidate_sha }}"
          $observedSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observedSha -ne $expectedSha) {
            throw "Builder HEAD drift after build: expected $expectedSha, observed $observedSha."
          }
          $versionSource = Get-Content desktop\__version__.py -Raw
          if ($versionSource -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Could not parse desktop/__version__.py."
          }
          if ($Matches[1] -ne $expectedVersion) {
            throw "Version drift: bundled version '$($Matches[1])' != '$expectedVersion'."
          }
          $buildInfo = Get-Content desktop\_build_info.py -Raw
          if ($buildInfo -notmatch 'build_commit\s*=\s*"([0-9a-f]+)"') {
            throw "Could not parse build_commit from desktop/_build_info.py."
          }
          if (-not $expectedSha.StartsWith($Matches[1].ToLowerInvariant())) {
            throw "Build provenance commit '$($Matches[1])' does not match $expectedSha."
          }

      - name: Package candidate artifact
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.resolve-candidate.outputs.version }}"
          $expectedSha = "${{ needs.resolve-candidate.outputs.candidate_sha }}"
          $observedSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observedSha -ne $expectedSha) {
            throw "Builder HEAD drift before packaging: expected $expectedSha, observed $observedSha."
          }
          $zip = "CVMAnalytics-windows-v$version.zip"
          Compress-Archive -Path dist\CVMAnalytics\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding utf8 -NoNewline
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $roots = @($archive.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique)
            if (-not ($roots -contains 'CVMAnalytics.exe' -and $roots -contains '_internal')) {
              throw "Release ZIP must have CVMAnalytics.exe and _internal at its flat root."
            }
          } finally {
            $archive.Dispose()
          }
          "zip_sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload immutable candidate package
        id: upload_package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-package-${{ needs.resolve-candidate.outputs.version }}-${{ needs.resolve-candidate.outputs.candidate_sha }}
          if-no-files-found: error
          path: |
            CVMAnalytics-windows-v${{ needs.resolve-candidate.outputs.version }}.zip
            CVMAnalytics-windows-v${{ needs.resolve-candidate.outputs.version }}.zip.sha256

      - name: Write candidate evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = 1
            candidate = [ordered]@{
              version = "${{ needs.resolve-candidate.outputs.version }}"
              tag = "${{ needs.resolve-candidate.outputs.tag }}"
              candidate_sha = "${{ needs.resolve-candidate.outputs.candidate_sha }}"
              tag_target_sha = "${{ needs.resolve-candidate.outputs.tag_target_sha }}"
              candidate_run_id = "$env:GITHUB_RUN_ID"
              observed_build_sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
            }
            exact_sha_ci = [ordered]@{
              event = "push"
              branch = "main"
              run_id = "${{ needs.resolve-candidate.outputs.ci_run_id }}"
              run_url = "${{ needs.resolve-candidate.outputs.ci_run_url }}"
              conclusion = "success"
            }
            package_artifact = [ordered]@{
              id = "${{ steps.upload_package.outputs.artifact-id }}"
              name = "release-candidate-package-${{ needs.resolve-candidate.outputs.version }}-${{ needs.resolve-candidate.outputs.candidate_sha }}"
              zip = "CVMAnalytics-windows-v${{ needs.resolve-candidate.outputs.version }}.zip"
              checksum = "${{ steps.package.outputs.zip_sha256 }}"
            }
            manual_evidence = [ordered]@{
              local_data = "required: candidate-bound manual evidence attestation"
              packaged = "required: candidate-bound manual evidence attestation"
              conditional = "required: typed candidate-bound applicability attestation"
            }
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -Path candidate-evidence.json -Encoding utf8

      - name: Upload immutable candidate evidence
        id: upload_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-evidence-${{ needs.resolve-candidate.outputs.version }}-${{ needs.resolve-candidate.outputs.candidate_sha }}
          if-no-files-found: error
          path: candidate-evidence.json

  attest-evidence:
    if: inputs.phase == 'attest'
    name: Attest release evidence from trusted main
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      LOCAL_DATA_EVIDENCE_SUMMARY: ${{ inputs.local_data_evidence_summary }}
      PACKAGED_EVIDENCE_SUMMARY: ${{ inputs.packaged_evidence_summary }}
      API_EVIDENCE_STATUS: ${{ inputs.api_evidence_status }}
      API_EVIDENCE_BASIS_TYPE: ${{ inputs.api_evidence_basis_type }}
      API_EVIDENCE_BASIS_SUMMARY: ${{ inputs.api_evidence_basis_summary }}
      API_EVIDENCE_RESULT_SUMMARY: ${{ inputs.api_evidence_result_summary }}
      CCEE_EVIDENCE_STATUS: ${{ inputs.ccee_evidence_status }}
      CCEE_EVIDENCE_BASIS_TYPE: ${{ inputs.ccee_evidence_basis_type }}
      CCEE_EVIDENCE_BASIS_SUMMARY: ${{ inputs.ccee_evidence_basis_summary }}
      CCEE_EVIDENCE_RESULT_SUMMARY: ${{ inputs.ccee_evidence_result_summary }}
      STRICT_BACKUP_EVIDENCE_STATUS: ${{ inputs.strict_backup_evidence_status }}
      STRICT_BACKUP_EVIDENCE_BASIS_TYPE: ${{ inputs.strict_backup_evidence_basis_type }}
      STRICT_BACKUP_EVIDENCE_BASIS_SUMMARY: ${{ inputs.strict_backup_evidence_basis_summary }}
      STRICT_BACKUP_EVIDENCE_RESULT_SUMMARY: ${{ inputs.strict_backup_evidence_result_summary }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate binding and write trusted attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION.Trim()
          $candidateSha = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          $candidateRunId = $env:CANDIDATE_RUN_ID.Trim()
          $releaseVersionPattern = '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-rc\.(?:0|[1-9][0-9]*))?$'
          if ($version -notmatch $releaseVersionPattern -or $candidateSha -notmatch '^[0-9a-f]{40}$' -or $candidateRunId -notmatch '^[1-9][0-9]*$') {
            throw "Attest requires a supported version, full candidate SHA, and numeric successful candidate_run_id."
          }
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Attest dispatches must run the reviewed workflow from refs/heads/main."
          }
          $workflowSourceSha = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($workflowSourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "Attest must identify a full trusted-main workflow source SHA."
          }
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -ne $candidateSha) {
            throw "Attest checkout does not match candidate SHA."
          }
          $tag = "v$version"
          git fetch --no-tags origin main
          git fetch --force origin "refs/tags/$tag`:refs/tags/$tag"
          git merge-base --is-ancestor $candidateSha origin/main
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "$tag^{commit}").Trim().ToLowerInvariant() -ne $candidateSha) {
            throw "Candidate is stale or the tag target no longer matches the candidate SHA."
          }
          $candidateRun = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId" | ConvertFrom-Json
          if ($candidateRun.name -ne "Release Desktop" -or $candidateRun.path -ne ".github/workflows/release-desktop.yml" -or $candidateRun.event -ne "workflow_dispatch" -or $candidateRun.conclusion -ne "success" -or $candidateRun.head_branch -ne "main" -or $candidateRun.head_sha -ne $candidateSha) {
            throw "candidate_run_id must identify the successful trusted-main candidate run for this exact SHA."
          }
          $artifacts = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId/artifacts?per_page=100" | ConvertFrom-Json
          $packageName = "release-candidate-package-$version-$candidateSha"
          $evidenceName = "release-candidate-evidence-$version-$candidateSha"
          $package = @($artifacts.artifacts | Where-Object { $_.name -eq $packageName -and -not $_.expired })
          $evidence = @($artifacts.artifacts | Where-Object { $_.name -eq $evidenceName -and -not $_.expired })
          if ($package.Count -ne 1 -or $evidence.Count -ne 1) {
            throw "Candidate run must retain one non-expired package and evidence artifact for this exact version/SHA."
          }
          $candidateEvidenceZip = Join-Path $env:RUNNER_TEMP "candidate-evidence-$($evidence[0].id).zip"
          & gh api --header "Accept: application/vnd.github+json" --output $candidateEvidenceZip "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($evidence[0].id)/zip"
          if ($LASTEXITCODE -ne 0) { throw "Could not download immutable candidate evidence." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($candidateEvidenceZip)
          try {
            $entry = @($archive.Entries | Where-Object { $_.FullName -eq "candidate-evidence.json" })
            if ($entry.Count -ne 1) { throw "Candidate evidence artifact must contain candidate-evidence.json." }
            $reader = [System.IO.StreamReader]::new($entry[0].Open())
            try { $candidatePayload = $reader.ReadToEnd() | ConvertFrom-Json -ErrorAction Stop } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          if ([string]$candidatePayload.schema_version -ne "1" -or $candidatePayload.candidate.candidate_sha -ne $candidateSha -or $candidatePayload.candidate.tag_target_sha -ne $candidateSha -or [string]$candidatePayload.candidate.candidate_run_id -ne $candidateRunId -or $candidatePayload.candidate.observed_build_sha -ne $candidateSha -or [string]$candidatePayload.package_artifact.id -ne "$($package[0].id)" -or $candidatePayload.package_artifact.checksum -notmatch '^[0-9a-f]{64}$') {
            throw "Immutable candidate evidence does not bind this exact candidate, run, package artifact, and checksum."
          }
          $checksum = $candidatePayload.package_artifact.checksum
          function Require-Text([string]$Name) {
            $value = [string](Get-Item "Env:$Name").Value
            if ([string]::IsNullOrWhiteSpace($value)) { throw "$Name is required for trusted attestation." }
            return $value.Trim()
          }
          function New-ConditionalDecision([string]$Prefix) {
            $status = Require-Text "${Prefix}_STATUS"
            $basisType = Require-Text "${Prefix}_BASIS_TYPE"
            $basisSummary = Require-Text "${Prefix}_BASIS_SUMMARY"
            $resultSummary = [string](Get-Item "Env:${Prefix}_RESULT_SUMMARY").Value
            if ($status -notin @("required", "not-required") -or $basisType -notin @("candidate-diff", "release-policy")) {
              throw "$Prefix must use required/not-required and candidate-diff/release-policy."
            }
            if ($status -eq "required" -and [string]::IsNullOrWhiteSpace($resultSummary)) {
              throw "$Prefix result summary is required when the decision is required."
            }
            return [ordered]@{ status = $status; basis = [ordered]@{ type = $basisType; candidate_sha = $candidateSha; tag_target_sha = $candidateSha; summary = $basisSummary }; result = [ordered]@{ manual = ($status -eq "required"); summary = $resultSummary.Trim() } }
          }
          $producer = [ordered]@{ workflow_run_id = "$env:GITHUB_RUN_ID"; phase = "attest"; workflow_name = "Release Desktop"; workflow_path = ".github/workflows/release-desktop.yml"; head_ref = "main"; workflow_source_sha = $workflowSourceSha }
          $candidate = [ordered]@{ candidate_sha = $candidateSha; tag_target_sha = $candidateSha; candidate_run_id = $candidateRunId; package_artifact_id = "$($package[0].id)"; zip_checksum = $checksum }
          function Write-Attestation([string]$Type, $Result, $Decision) {
            $payload = [ordered]@{ schema_version = 1; attestation_type = $Type; candidate = $candidate; producer = $producer; result = $Result }
            if ($null -ne $Decision) { $payload.decision = [ordered]@{ status = $Decision.status; basis = $Decision.basis }; $payload.result = $Decision.result }
            $payload | ConvertTo-Json -Depth 8 | Set-Content -Path "release-evidence-attestation-$Type.json" -Encoding utf8
          }
          Write-Attestation "manual-local-data" ([ordered]@{ manual = $true; summary = (Require-Text "LOCAL_DATA_EVIDENCE_SUMMARY") }) $null
          Write-Attestation "manual-packaged" ([ordered]@{ manual = $true; summary = (Require-Text "PACKAGED_EVIDENCE_SUMMARY") }) $null
          Write-Attestation "conditional-api" $null (New-ConditionalDecision "API_EVIDENCE")
          Write-Attestation "conditional-ccee" $null (New-ConditionalDecision "CCEE_EVIDENCE")
          Write-Attestation "conditional-strict-backup" $null (New-ConditionalDecision "STRICT_BACKUP_EVIDENCE")

      - name: Upload local-data attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-manual-local-data-${{ github.run_id }}
          if-no-files-found: error
          path: release-evidence-attestation-manual-local-data.json

      - name: Upload packaged-app attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-manual-packaged-${{ github.run_id }}
          if-no-files-found: error
          path: release-evidence-attestation-manual-packaged.json

      - name: Upload API attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-conditional-api-${{ github.run_id }}
          if-no-files-found: error
          path: release-evidence-attestation-conditional-api.json

      - name: Upload CCEE attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-conditional-ccee-${{ github.run_id }}
          if-no-files-found: error
          path: release-evidence-attestation-conditional-ccee.json

      - name: Upload rollback-backup attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-conditional-strict-backup-${{ github.run_id }}
          if-no-files-found: error
          path: release-evidence-attestation-conditional-strict-backup.json

  publish-preflight:
    if: inputs.phase == 'publish'
    name: Reverify candidate, CI, and evidence handoff
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
    outputs:
      package_artifact_id: ${{ steps.verify.outputs.package_artifact_id }}
      evidence_artifact_id: ${{ steps.verify.outputs.evidence_artifact_id }}
      verified_evidence_artifact_id: ${{ steps.upload_verified_evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-resolve exact candidate, CI, and candidate artifact identities
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Release dispatches must run the reviewed workflow from refs/heads/main."
          }
          $version = $env:RELEASE_VERSION.Trim()
          $candidateSha = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          $candidateRunId = $env:CANDIDATE_RUN_ID.Trim()
          $releaseVersionPattern = '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-rc\.(?:0|[1-9][0-9]*))?$'
          if ($version -notmatch $releaseVersionPattern -or $candidateSha -notmatch '^[0-9a-f]{40}$' -or $candidateRunId -notmatch '^[1-9][0-9]*$') {
            throw "Publish requires a supported version, full candidate SHA, and numeric successful candidate_run_id."
          }
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -ne $candidateSha) {
            throw "Publish checkout does not match candidate SHA."
          }
          $tag = "v$version"
          git fetch --no-tags origin main
          git fetch --force origin "refs/tags/$tag`:refs/tags/$tag"
          git merge-base --is-ancestor $candidateSha origin/main
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "$tag^{commit}").Trim().ToLowerInvariant() -ne $candidateSha) {
            throw "Candidate is stale or the tag target no longer matches the candidate SHA."
          }
          $runs = gh api "/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$candidateSha&per_page=100" | ConvertFrom-Json
          $latest = @($runs.workflow_runs | Where-Object { $_.event -eq "push" -and $_.head_branch -eq "main" -and $_.head_sha -eq $candidateSha } | Sort-Object -Property @{ Expression = { $_.created_at }; Descending = $true }, @{ Expression = { $_.run_attempt }; Descending = $true } | Select-Object -First 1)
          if ($latest.Count -ne 1 -or $latest[0].status -ne "completed" -or $latest[0].conclusion -ne "success") {
            throw "Latest exact-SHA push/main CI is absent or not completed/success."
          }
          $candidateRun = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId" | ConvertFrom-Json
          if ($candidateRun.name -ne "Release Desktop" -or $candidateRun.path -ne ".github/workflows/release-desktop.yml" -or $candidateRun.event -ne "workflow_dispatch" -or $candidateRun.conclusion -ne "success" -or $candidateRun.head_branch -ne "main" -or $candidateRun.head_sha -ne $candidateSha) {
            throw "candidate_run_id must identify the successful trusted-main Release Desktop candidate run."
          }
          $artifacts = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId/artifacts?per_page=100" | ConvertFrom-Json
          $packageName = "release-candidate-package-$version-$candidateSha"
          $evidenceName = "release-candidate-evidence-$version-$candidateSha"
          $package = @($artifacts.artifacts | Where-Object { $_.name -eq $packageName -and -not $_.expired })
          $evidence = @($artifacts.artifacts | Where-Object { $_.name -eq $evidenceName -and -not $_.expired })
          if ($package.Count -ne 1 -or $evidence.Count -ne 1) {
            throw "Candidate run must retain one non-expired package and evidence artifact for this exact version/SHA."
          }
          "package_artifact_id=$($package[0].id)" >> $env:GITHUB_OUTPUT
          "evidence_artifact_id=$($evidence[0].id)" >> $env:GITHUB_OUTPUT

      - name: Fetch and verify candidate-bound evidence attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PACKAGE_ARTIFACT_ID: ${{ steps.verify.outputs.package_artifact_id }}
          CANDIDATE_EVIDENCE_ARTIFACT_ID: ${{ steps.verify.outputs.evidence_artifact_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $candidateSha = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          $candidateRunId = $env:CANDIDATE_RUN_ID.Trim()
          $attestationRunId = $env:ATTESTATION_RUN_ID.Trim()
          if ($attestationRunId -notmatch '^[1-9][0-9]*$') {
            throw "Publish requires a numeric trusted attestation_run_id."
          }
          $attestationRun = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$attestationRunId" | ConvertFrom-Json
          $attestationWorkflowSourceSha = $attestationRun.head_sha.Trim().ToLowerInvariant()
          if ($attestationRun.name -ne "Release Desktop" -or $attestationRun.path -ne ".github/workflows/release-desktop.yml" -or $attestationRun.event -ne "workflow_dispatch" -or $attestationRun.conclusion -ne "success" -or $attestationRun.head_branch -ne "main" -or $attestationWorkflowSourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "attestation_run_id must identify a successful trusted-main Release Desktop attest run."
          }
          $attestationArtifacts = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$attestationRunId/artifacts?per_page=100" | ConvertFrom-Json
          function Resolve-AttestationArtifact([string]$Name) {
            $matches = @($attestationArtifacts.artifacts | Where-Object { $_.name -eq $Name -and -not $_.expired })
            if ($matches.Count -ne 1) { throw "Trusted attestation run must retain exactly one non-expired '$Name' artifact." }
            return "$($matches[0].id)"
          }
          function Read-ActionArtifactJson {
            param([string]$ArtifactId, [string]$ExpectedEntryName, [bool]$RequireTrustedProducer = $true)
            if ($ArtifactId -notmatch '^[1-9][0-9]*$') {
              throw "Evidence artifact ID must be a positive decimal Actions artifact ID."
            }
            $metadata = (& gh api "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$ArtifactId" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $metadata.expired -or -not $metadata.workflow_run.id) {
              throw "Evidence artifact $ArtifactId is missing, expired, or lacks workflow-run provenance."
            }
            if ($RequireTrustedProducer -and [string]$metadata.workflow_run.id -ne $attestationRunId) {
              throw "Evidence artifact $ArtifactId is not produced by the selected trusted attestation run."
            }
            $producerRun = (& gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$($metadata.workflow_run.id)" | ConvertFrom-Json)
            if ($RequireTrustedProducer -and ($producerRun.name -ne "Release Desktop" -or $producerRun.path -ne ".github/workflows/release-desktop.yml" -or $producerRun.event -ne "workflow_dispatch" -or $producerRun.conclusion -ne "success" -or $producerRun.head_branch -ne "main" -or $producerRun.head_sha -notmatch '^[0-9a-f]{40}$')) {
              throw "Evidence artifact $ArtifactId was not produced by the successful trusted-main Release Desktop run for this candidate."
            }
            $zipPath = Join-Path $env:RUNNER_TEMP "release-evidence-$ArtifactId.zip"
            & gh api --header "Accept: application/vnd.github+json" --output $zipPath "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$ArtifactId/zip"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $zipPath)) {
              throw "Could not download immutable evidence artifact $ArtifactId."
            }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $files = @($archive.Entries | Where-Object { -not $_.FullName.EndsWith('/') })
              if ($files.Count -ne 1 -or $files[0].FullName -ne $ExpectedEntryName) {
                throw "Evidence artifact $ArtifactId must contain exactly $ExpectedEntryName."
              }
              $reader = [System.IO.StreamReader]::new($files[0].Open())
              try { $content = $reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally {
              $archive.Dispose()
            }
            try { $payload = $content | ConvertFrom-Json -ErrorAction Stop } catch {
              throw "Evidence artifact $ArtifactId contains invalid JSON."
            }
            [pscustomobject]@{
              artifact_id = "$ArtifactId"
              workflow_run_id = "$($metadata.workflow_run.id)"
              producer_run = $producerRun
              zip_sha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
              content_sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($content))).ToLowerInvariant()
              payload = $payload
            }
          }
          function Assert-AttestationBinding {
            param($Artifact, [string]$ExpectedType, [string]$CandidateSha, [string]$CandidateRunId, [string]$PackageArtifactId, [string]$ZipChecksum, [string]$WorkflowSourceSha, [switch]$Conditional)
            $payload = $Artifact.payload
            if ([string]$payload.schema_version -ne "1" -or $payload.attestation_type -ne $ExpectedType) {
              throw "Evidence artifact $($Artifact.artifact_id) has an unsupported attestation schema or type."
            }
            if ($payload.candidate.candidate_sha -ne $CandidateSha -or $payload.candidate.tag_target_sha -ne $CandidateSha -or [string]$payload.candidate.candidate_run_id -ne $CandidateRunId -or [string]$payload.candidate.package_artifact_id -ne $PackageArtifactId -or $payload.candidate.zip_checksum -ne $ZipChecksum) {
              throw "Evidence artifact $($Artifact.artifact_id) is not bound to the exact candidate/package/checksum."
            }
            if ([string]$payload.producer.workflow_run_id -ne $Artifact.workflow_run_id) {
              throw "Evidence artifact $($Artifact.artifact_id) producer workflow-run identity differs from Actions metadata."
            }
            if ($payload.producer.phase -ne "attest" -or $payload.producer.workflow_name -ne "Release Desktop" -or $payload.producer.workflow_path -ne ".github/workflows/release-desktop.yml" -or $payload.producer.head_ref -ne "main" -or $payload.producer.workflow_source_sha -ne $WorkflowSourceSha) {
              throw "Evidence artifact $($Artifact.artifact_id) does not declare the trusted attest producer identity."
            }
            if (-not $Conditional -and ($payload.result.manual -ne $true -or [string]::IsNullOrWhiteSpace($payload.result.summary))) {
              throw "Manual evidence artifact $($Artifact.artifact_id) lacks a recorded operator result."
            }
            if ($Conditional) {
              if ($payload.decision.status -notin @("required", "not-required") -or $payload.decision.basis.type -notin @("candidate-diff", "release-policy")) {
                throw "Conditional evidence artifact $($Artifact.artifact_id) lacks a typed required/not-required decision and basis."
              }
              if ($payload.decision.basis.candidate_sha -ne $CandidateSha -or $payload.decision.basis.tag_target_sha -ne $CandidateSha -or [string]::IsNullOrWhiteSpace($payload.decision.basis.summary)) {
                throw "Conditional evidence artifact $($Artifact.artifact_id) has no candidate-bound policy/diff basis."
              }
              if ($payload.decision.status -eq "required" -and ($payload.result.manual -ne $true -or [string]::IsNullOrWhiteSpace($payload.result.summary))) {
                throw "Required conditional evidence artifact $($Artifact.artifact_id) lacks a recorded manual result."
              }
            }
          }
          $candidateEvidence = Read-ActionArtifactJson $env:CANDIDATE_EVIDENCE_ARTIFACT_ID "candidate-evidence.json" $false
          $candidatePayload = $candidateEvidence.payload
          if ([string]$candidatePayload.schema_version -ne "1" -or $candidatePayload.candidate.candidate_sha -ne $candidateSha -or $candidatePayload.candidate.tag_target_sha -ne $candidateSha -or [string]$candidatePayload.candidate.candidate_run_id -ne $candidateRunId -or $candidatePayload.candidate.observed_build_sha -ne $candidateSha -or [string]$candidatePayload.package_artifact.id -ne $env:CANDIDATE_PACKAGE_ARTIFACT_ID -or $candidatePayload.package_artifact.checksum -notmatch '^[0-9a-f]{64}$') {
            throw "Immutable candidate evidence does not bind this exact candidate, run, package artifact, and checksum."
          }
          $checksum = $candidatePayload.package_artifact.checksum
          $manual = @(
            @{ id = Resolve-AttestationArtifact "release-attestation-manual-local-data-$attestationRunId"; type = "manual-local-data" },
            @{ id = Resolve-AttestationArtifact "release-attestation-manual-packaged-$attestationRunId"; type = "manual-packaged" }
          )
          $conditional = @(
            @{ id = Resolve-AttestationArtifact "release-attestation-conditional-api-$attestationRunId"; type = "conditional-api" },
            @{ id = Resolve-AttestationArtifact "release-attestation-conditional-ccee-$attestationRunId"; type = "conditional-ccee" },
            @{ id = Resolve-AttestationArtifact "release-attestation-conditional-strict-backup-$attestationRunId"; type = "conditional-strict-backup" }
          )
          $verified = @()
          foreach ($item in $manual) {
            $artifact = Read-ActionArtifactJson $item.id "release-evidence-attestation.json"
            Assert-AttestationBinding $artifact $item.type $candidateSha $candidateRunId $env:CANDIDATE_PACKAGE_ARTIFACT_ID $checksum $attestationWorkflowSourceSha
            $verified += [ordered]@{ artifact_id = $artifact.artifact_id; workflow_run_id = $artifact.workflow_run_id; zip_sha256 = $artifact.zip_sha256; content_sha256 = $artifact.content_sha256; attestation_type = $item.type }
          }
          foreach ($item in $conditional) {
            $artifact = Read-ActionArtifactJson $item.id "release-evidence-attestation.json"
            Assert-AttestationBinding $artifact $item.type $candidateSha $candidateRunId $env:CANDIDATE_PACKAGE_ARTIFACT_ID $checksum $attestationWorkflowSourceSha -Conditional
            $verified += [ordered]@{ artifact_id = $artifact.artifact_id; workflow_run_id = $artifact.workflow_run_id; zip_sha256 = $artifact.zip_sha256; content_sha256 = $artifact.content_sha256; attestation_type = $item.type; decision_status = $artifact.payload.decision.status; decision_basis_type = $artifact.payload.decision.basis.type }
          }
          [ordered]@{
            schema_version = 1
            candidate = [ordered]@{ candidate_sha = $candidateSha; tag_target_sha = $candidateSha; candidate_run_id = $candidateRunId; package_artifact_id = $env:CANDIDATE_PACKAGE_ARTIFACT_ID; zip_checksum = $checksum }
            candidate_evidence = [ordered]@{ artifact_id = $candidateEvidence.artifact_id; workflow_run_id = $candidateEvidence.workflow_run_id; zip_sha256 = $candidateEvidence.zip_sha256; content_sha256 = $candidateEvidence.content_sha256 }
            attestations = $verified
          } | ConvertTo-Json -Depth 6 | Set-Content -Path verified-release-evidence.json -Encoding utf8

      - name: Upload verified evidence binding
        id: upload_verified_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verified-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: verified-release-evidence.json

  final-publish:
    if: inputs.phase == 'publish'
    name: Publish verified candidate
    needs: publish-preflight
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      VERIFIED_EVIDENCE_ARTIFACT_ID: ${{ needs.publish-preflight.outputs.verified_evidence_artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.publish-preflight.outputs.package_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          path: candidate-package

      - name: Download immutable candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.publish-preflight.outputs.evidence_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          path: candidate-evidence

      - name: Download verified manual evidence binding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.VERIFIED_EVIDENCE_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          path: verified-evidence

      - name: Verify the same candidate artifact, tag, and latest CI after approval
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION.Trim()
          $candidateSha = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          $releaseVersionPattern = '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-rc\.(?:0|[1-9][0-9]*))?$'
          if ($version -notmatch $releaseVersionPattern -or $candidateSha -notmatch '^[0-9a-f]{40}$' -or $env:CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "Final publish requires the updater-compatible version grammar and exact candidate identity."
          }
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -ne $candidateSha) {
            throw "Final publish checkout drifted from the candidate SHA."
          }
          $tag = "v$version"
          git fetch --no-tags origin main
          git fetch --force origin "refs/tags/$tag`:refs/tags/$tag"
          git merge-base --is-ancestor $candidateSha origin/main
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "$tag^{commit}").Trim().ToLowerInvariant() -ne $candidateSha) {
            throw "Final tag/main identity check failed; refusing to publish."
          }
          $runs = gh api "/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$candidateSha&per_page=100" | ConvertFrom-Json
          $latest = @($runs.workflow_runs | Where-Object { $_.event -eq "push" -and $_.head_branch -eq "main" -and $_.head_sha -eq $candidateSha } | Sort-Object -Property @{ Expression = { $_.created_at }; Descending = $true }, @{ Expression = { $_.run_attempt }; Descending = $true } | Select-Object -First 1)
          if ($latest.Count -ne 1 -or $latest[0].status -ne "completed" -or $latest[0].conclusion -ne "success") {
            throw "Latest exact-SHA push/main CI is absent or not completed/success after approval."
          }
          $evidence = Get-Content candidate-evidence/candidate-evidence.json -Raw | ConvertFrom-Json
          if ($evidence.candidate.version -ne $version -or $evidence.candidate.candidate_sha -ne $candidateSha -or $evidence.candidate.tag -ne $tag -or $evidence.candidate.tag_target_sha -ne $candidateSha -or [string]$evidence.candidate.candidate_run_id -ne $env:CANDIDATE_RUN_ID -or $evidence.candidate.observed_build_sha -ne $candidateSha) {
            throw "Candidate evidence identity does not match this publication request."
          }
          if ($evidence.package_artifact.id -ne "${{ needs.publish-preflight.outputs.package_artifact_id }}") {
            throw "Candidate evidence package artifact identity differs from the selected immutable artifact."
          }
          $zip = "candidate-package/CVMAnalytics-windows-v$version.zip"
          $checksumFile = "$zip.sha256"
          if (-not (Test-Path $zip) -or -not (Test-Path $checksumFile)) {
            throw "Downloaded immutable candidate package is incomplete."
          }
          $checksum = (Get-Content $checksumFile -Raw).Trim() -split '\s+' | Select-Object -First 1
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $actual -or $actual -ne $evidence.package_artifact.checksum) {
            throw "Downloaded ZIP checksum does not match the immutable candidate evidence."
          }
          $verified = Get-Content verified-evidence/verified-release-evidence.json -Raw | ConvertFrom-Json
          if ([string]$verified.schema_version -ne "1" -or $verified.candidate.candidate_sha -ne $candidateSha -or $verified.candidate.tag_target_sha -ne $candidateSha -or [string]$verified.candidate.candidate_run_id -ne $env:CANDIDATE_RUN_ID -or [string]$verified.candidate.package_artifact_id -ne "${{ needs.publish-preflight.outputs.package_artifact_id }}" -or $verified.candidate.zip_checksum -ne $actual -or @($verified.attestations).Count -ne 5) {
            throw "Verified manual evidence binding does not match the final candidate package."
          }

      - name: Write publication evidence bound to the verified candidate
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          $candidateSha = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          $verifiedPath = "verified-evidence/verified-release-evidence.json"
          $evidence = [ordered]@{
            schema_version = 1
            candidate_sha = $candidateSha
            tag_target_sha = $candidateSha
            version = $version
            candidate_run_id = $env:CANDIDATE_RUN_ID
            package_artifact_id = "${{ needs.publish-preflight.outputs.package_artifact_id }}"
            zip_checksum = (Get-FileHash "candidate-package/CVMAnalytics-windows-v$version.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            verified_evidence_artifact_id = $env:VERIFIED_EVIDENCE_ARTIFACT_ID
            verified_evidence_content_sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([IO.File]::ReadAllBytes($verifiedPath))).ToLowerInvariant()
            attestations = (Get-Content $verifiedPath -Raw | ConvertFrom-Json).attestations
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -Path manual-evidence.json -Encoding utf8

      - name: Upload immutable publication evidence before release creation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publication-evidence-${{ env.RELEASE_VERSION }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          if-no-files-found: error
          path: manual-evidence.json

      - name: Prepare verified release aliases
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          Copy-Item "candidate-package/CVMAnalytics-windows-v$version.zip" "CVMAnalytics-windows-v$version.zip"
          Copy-Item "candidate-package/CVMAnalytics-windows-v$version.zip.sha256" "CVMAnalytics-windows-v$version.zip.sha256"
          Copy-Item "CVMAnalytics-windows-v$version.zip" "CVMAnalytics-windows.zip"
          $latestHash = (Get-FileHash "CVMAnalytics-windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$latestHash  CVMAnalytics-windows.zip" | Out-File -FilePath "CVMAnalytics-windows.zip.sha256" -Encoding utf8 -NoNewline

      - name: Publish GitHub Release from verified candidate only
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: CVM Analytics v${{ env.RELEASE_VERSION }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-rc.') }}
          generate_release_notes: true
          files: |
            CVMAnalytics-windows-v${{ env.RELEASE_VERSION }}.zip
            CVMAnalytics-windows-v${{ env.RELEASE_VERSION }}.zip.sha256
            CVMAnalytics-windows.zip
            CVMAnalytics-windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
