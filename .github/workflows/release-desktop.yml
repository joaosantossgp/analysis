name: Release Desktop

# Build-once publications (ADR 0011, issue #629). After CI passes on a push to
# main, the decision module (scripts/release/publication_decision.py) decides
# from the shipping classes and changed paths since the last publication whether
# to publish, as a pre-release or a release, with which version, and whether the
# owner must approve. One candidate is built from the exact commit and that same
# file is published: with no approval for a low-risk pre-release, otherwise after
# the owner approves in the release-publication environment. The tag is created
# with the release, so a rejected or superseded candidate leaves no tag.
# Contract: docs/release-process.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the candidate and stop before tagging and publishing."
        type: boolean
        default: true
      assume_class:
        description: "Dry run only: add a PR with this shipping class (none, pre, release or hotfix) to the decision."
        type: string
        default: ""

permissions:
  contents: read

# A newer acting run cancels the one in progress: merges that land during a
# build collapse into the next candidate, and a candidate still waiting for
# approval is superseded. Dry runs and CI events that do not act (failed CI,
# pull requests) get a group of their own and cancel nothing.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
         || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == 'refs/heads/main'))
        && 'release-publication'
        || format('release-publication-noop-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide publication
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      kind: ${{ steps.decide.outputs.kind }}
      version: ${{ steps.decide.outputs.version }}
      approval_required: ${{ steps.decide.outputs.approval_required }}
      candidate_sha: ${{ steps.decide.outputs.candidate_sha }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Collect facts and decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ASSUME_CLASS: ${{ inputs.assume_class }}
        run: |
          set -euo pipefail
          python scripts/release/publication_workflow.py facts > facts.json
          python scripts/release/publication_decision.py decide --input facts.json > decision.json
          python scripts/release/publication_workflow.py report --facts facts.json --decision decision.json

      - name: Keep the decision with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-decision
          if-no-files-found: error
          path: |
            facts.json
            decision.json

  build:
    name: Build candidate ${{ needs.decide.outputs.version }}
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: windows-latest
    outputs:
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.decide.outputs.version }}
      CANDIDATE_SHA: ${{ needs.decide.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.candidate_sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop-web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Vite desktop UI dependencies
        run: npm ci --prefix apps/desktop-web

      - name: Build desktop bundle once with the decided version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw "Checkout is not the candidate commit $env:CANDIDATE_SHA." }
          .\desktop\build_desktop.ps1 -Version $env:RELEASE_VERSION

      - name: Verify stamped version and build commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw "Builder HEAD moved during the build." }
          if ((Get-Content desktop\__version__.py -Raw) -notmatch '__version__\s*=\s*"([^"]+)"' -or $Matches[1] -ne $env:RELEASE_VERSION) {
            throw "Bundled version is not $env:RELEASE_VERSION."
          }
          if ((Get-Content desktop\_build_info.py -Raw) -notmatch 'build_commit\s*=\s*"([0-9a-f]+)"' -or -not $env:CANDIDATE_SHA.StartsWith($Matches[1])) {
            throw "Build provenance commit does not match $env:CANDIDATE_SHA."
          }

      - name: Package candidate
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "CVMAnalytics-windows-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path dist\CVMAnalytics\* -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $roots = @($archive.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique)
            if (-not ($roots -contains 'CVMAnalytics.exe' -and $roots -contains '_internal')) {
              throw "The ZIP must have CVMAnalytics.exe and _internal at its flat root."
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding utf8 -NoNewline
          "zip_sha256=$hash" >> $env:GITHUB_OUTPUT
          "Candidate ``$zip`` sha256 ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the candidate with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-candidate
          if-no-files-found: error
          path: |
            CVMAnalytics-windows-v${{ needs.decide.outputs.version }}.zip
            CVMAnalytics-windows-v${{ needs.decide.outputs.version }}.zip.sha256

  # The three jobs below run the same steps; exactly one runs per candidate.
  publish-automatic:
    name: Publish ${{ needs.decide.outputs.version }} (${{ needs.decide.outputs.kind }}) with no approval
    needs: [decide, build]
    if: needs.decide.outputs.dry_run == 'false' && needs.decide.outputs.approval_required == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env: &publish_env
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ needs.decide.outputs.dry_run }}
      EXPECTED_SHA256: ${{ needs.build.outputs.zip_sha256 }}
    steps: &publish_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Download the decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-decision
          path: decision

      - name: Download the candidate built by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-candidate
          path: candidate

      - name: Verify and publish the built candidate
        run: >-
          python scripts/release/publication_workflow.py publish
          --facts decision/facts.json --decision decision/decision.json
          --package-dir candidate --expected-sha256 "$EXPECTED_SHA256"

  publish-approved:
    name: Publish ${{ needs.decide.outputs.version }} (${{ needs.decide.outputs.kind }}) after the owner's approval
    needs: [decide, build]
    if: needs.decide.outputs.dry_run == 'false' && needs.decide.outputs.approval_required == 'true'
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
    env: *publish_env
    steps: *publish_steps

  rehearse-publication:
    name: Rehearse publication of ${{ needs.decide.outputs.version }} (dry run, publishes nothing)
    needs: [decide, build]
    if: needs.decide.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: *publish_env
    steps: *publish_steps
