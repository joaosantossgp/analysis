name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0 — without the v prefix)"
        required: true

jobs:
  build-windows:
    name: Build & publish Windows bundle
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop-web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Vite desktop UI dependencies
        run: npm ci --prefix apps/desktop-web

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version }}"
          if (-not $raw) {
            $raw = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "VERSION=$raw" >> $env:GITHUB_OUTPUT
          echo "TAG=v$raw" >> $env:GITHUB_OUTPUT

      - name: Build desktop bundle
        shell: pwsh
        run: |
          .\desktop\build_desktop.ps1 -Version "${{ steps.ver.outputs.VERSION }}"

      - name: Package release artifact
        id: pkg
        shell: pwsh
        run: |
          $ver  = "${{ steps.ver.outputs.VERSION }}"
          $zip  = "CVMAnalytics-windows-v$ver.zip"
          $latestZip = "CVMAnalytics-windows.zip"

          # Compress-Archive with -Path "dir" includes the directory as the
          # archive root, producing a CVMAnalytics/ wrapper. The auto-updater
          # contract (desktop/update_helper.ps1 allowlist) requires a FLAT
          # root with CVMAnalytics.exe + _internal/ at the top of the zip.
          # Use -Path "dir\*" so contents are written without a wrapper.
          Compress-Archive -Path dist\CVMAnalytics\* -DestinationPath $zip

          Copy-Item $zip $latestZip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding utf8 -NoNewline
          $latestHash = (Get-FileHash $latestZip -Algorithm SHA256).Hash.ToLower()
          "$latestHash  $latestZip" | Out-File -FilePath "$latestZip.sha256" -Encoding utf8 -NoNewline
          echo "ZIP=$zip" >> $env:GITHUB_OUTPUT
          echo "LATEST_ZIP=$latestZip" >> $env:GITHUB_OUTPUT

          # Verify the resulting zip has a flat root before publishing.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $roots = @($archive.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique)
            Write-Host "[release] zip roots: $($roots -join ', ')"
            if (-not ($roots -contains 'CVMAnalytics.exe' -and $roots -contains '_internal')) {
              throw "Release zip layout invalid. Roots: $($roots -join ', '). Expected to contain CVMAnalytics.exe and _internal at the archive root."
            }
          } finally {
            $archive.Dispose()
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "CVM Analytics ${{ steps.ver.outputs.TAG }}"
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.ZIP }}
            ${{ steps.pkg.outputs.ZIP }}.sha256
            ${{ steps.pkg.outputs.LATEST_ZIP }}
            ${{ steps.pkg.outputs.LATEST_ZIP }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
