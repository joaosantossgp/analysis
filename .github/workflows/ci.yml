name: CI

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
  merge_group:

jobs:
  test-python:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install root dependencies
        run: python -m pip install -r requirements.txt

      - name: Install API compatibility dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run repository governance contract tests
        run: python -m pytest scripts/governance/test_repository_operational_contracts.py scripts/governance/test_frontend_ci_contract.py scripts/diagnostics/test_bridge_method_inventory.py scripts/governance/test_packaged_candidate_harness.py -q

      - name: Compile desktop entry points
        run: python -m py_compile desktop/app.py desktop/bridge.py

      - name: Run desktop/core test suite
        run: pytest tests -q

  coverage-python:
    name: Python core coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install root dependencies
        run: python -m pip install -r requirements.txt

      - name: Install API compatibility dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Install coverage tooling
        run: python -m pip install pytest-cov>=5.0

      - name: Run Python coverage
        run: >
          pytest tests -q
          --cov=src
          --cov=desktop
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

  desktop-web:
    name: Vite desktop UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop-web/package-lock.json

      - name: Install Vite desktop UI dependencies
        run: npm ci

      - name: Test Vite desktop UI
        run: npm run test

      - name: Typecheck Vite desktop UI
        run: npm run typecheck

      - name: Build Vite desktop UI
        run: npm run build
