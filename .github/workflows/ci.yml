name: CI

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
  merge_group:

jobs:
  test-python:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install root dependencies
        run: python -m pip install -r requirements.txt

      - name: Install API compatibility dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run repository governance contract tests
        run: python -m pytest scripts/governance/test_repository_operational_contracts.py scripts/governance/test_frontend_ci_contract.py scripts/governance/test_production_disabled.py scripts/diagnostics/test_bridge_method_inventory.py scripts/governance/test_packaged_candidate_harness.py -q

      - name: Compile desktop entry points
        run: python -m py_compile desktop/app.py desktop/bridge.py

      - name: Run desktop/core test suite
        run: pytest tests -q

  coverage-python:
    name: Python core coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install root dependencies
        run: python -m pip install -r requirements.txt

      - name: Install API compatibility dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Install coverage tooling
        run: python -m pip install pytest-cov>=5.0

      - name: Run Python coverage
        run: >
          pytest tests -q
          --cov=src
          --cov=desktop
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

  desktop-web:
    name: Vite desktop UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop-web/package-lock.json

      - name: Install Vite desktop UI dependencies
        run: npm ci

      - name: Test Vite desktop UI
        run: npm run test

      - name: Typecheck Vite desktop UI
        run: npm run typecheck

      - name: Build Vite desktop UI
        run: npm run build
