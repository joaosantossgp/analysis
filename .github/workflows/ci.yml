name: CI

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-python:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install root dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository governance contract tests
        run: python -m pytest scripts/governance/test_repository_operational_contracts.py scripts/governance/test_frontend_ci_contract.py scripts/diagnostics/test_bridge_method_inventory.py scripts/governance/test_packaged_candidate_harness.py -q

      - name: Compile desktop entry points
        run: python -m py_compile desktop/app.py desktop/bridge.py

  coverage-python:
    name: Python core coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install root dependencies
        run: python -m pip install -r requirements.txt

      - name: Install API compatibility dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Install coverage tooling
        run: python -m pip install pytest-cov>=5.0

      - name: Run Python coverage
        run: >
          pytest tests apps/api/tests -q
          --cov=src
          --cov=desktop
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

  windows-storage:
    name: Windows storage inventory
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Test inventory persistence and Windows file contention
        run: python -m pytest tests/test_storage_inventory.py -q

  desktop-web:
    name: Vite desktop UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop-web/package-lock.json

      - name: Install Vite desktop UI dependencies
        run: npm ci

      - name: Test Vite desktop UI
        run: npm run test

      - name: Typecheck Vite desktop UI
        run: npm run typecheck

      - name: Build Vite desktop UI
        run: npm run build
